name: ssh-mcp

services:
  ssh-mcp:
    build: .
    image: sundonglai/ssh-mcp:latest
    container_name: ssh-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./work:/work
      # Optional for key authentication:
      # - ${HOME}/.ssh:/home/ssh-mcp/.ssh:ro
      # The same read-only mount supplies known_hosts for strict host-key checks.
    environment:
      SSH_MCP_AUTH_TOKEN: ${SSH_MCP_AUTH_TOKEN:-}
      SSH_STRICT_HOST_KEYS: ${SSH_STRICT_HOST_KEYS:-}
      # Internal-network default accepts new host keys.
    # Put an authenticated TLS reverse proxy in front before remote access.
